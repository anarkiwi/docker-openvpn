name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docker-openvpn:test
      - name: Smoke test (openvpn runs)
        run: |
          # openvpn --version exits non-zero by design; capture and grep instead.
          out=$(docker run --rm --entrypoint openvpn docker-openvpn:test --version 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qi "OpenVPN 2"
